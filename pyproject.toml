[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgnorm-sdk"
version = "0.1.0"
description = "DGNorm: dual-granularity extraction for HPO phenotype normalization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zhou Chong" }]
keywords = ["HPO", "phenotype normalization", "large language models", "clinical NLP"]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "requests>=2.28",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
full = ["sentence-transformers>=2.2", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
